<script>
(function () {
    var sound = document.getElementById('korok-sound');
    if (!sound) return;

    var GESTURES = ['pointerdown', 'keydown', 'touchstart'];

    function disarm() {
        GESTURES.forEach(function (name) {
            window.removeEventListener(name, playOnce);
        });
    }

    function playOnce() {
        disarm();
        if (!document.contains(sound)) return;
        play();
    }

    function play() {
        var attempt = sound.play();
        return attempt && attempt.catch ? attempt : null;
    }

    var attempt = play();
    if (attempt) {
        attempt.catch(function () {
            if (!document.contains(sound)) return;
            GESTURES.forEach(function (name) {
                window.addEventListener(name, playOnce, { passive: true });
            });
        });
    }
})();
</script>
